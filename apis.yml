aid: coris
name: Coris
description: 'Coris is an AI platform for merchant and payment risk, providing modern
  risk infrastructure for vertical SaaS platforms, payment processors, ISOs, PayFacs,
  and sponsor banks. Its MerchantProfiler product returns 100+ structured data attributes
  on any business — pulled from Secretary of State records, online presence, customer
  reviews, website/content signals, adverse media, and operational data — to power
  faster, more accurate merchant onboarding, KYB, underwriting, and ongoing risk monitoring.
  The platform also spans transaction monitoring, AI risk agents, and managed risk
  workflows, exposed through both a no-code console and REST APIs so customers can
  automate the full merchant lifecycle. Founded in 2022 and based in Palo Alto, Coris
  is backed by Lux Capital, Exponent Founders Capital, and Y Combinator, and works
  with companies including GoFundMe, Kajabi, Clio, and Cherry. Developer documentation
  is published on a password-gated ReadMe portal; this profile was enriched from public
  surfaces (marketing site, status page, trust center, legal pages).'
